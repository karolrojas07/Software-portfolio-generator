app = "software-portfolio-generator"
primary_region = "iad"

[build]

[env]
  PHX_SERVER = "true"
  PORT = "8080"
  DEFAULT_PROFILE_ID = "1"
  ECTO_IPV6 = "true"
  PHX_HOST = "software-portfolio-generator.fly.dev"

[deploy]
  #release_command = "/app/bin/software_portfolio_generator eval \"SoftwarePortfolioGenerator.Release.migrate\""

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.http_checks]]
    path = "/"
    interval = "10s"
    timeout = "5s"
    # Give the app more time to boot before failing health checks
    grace_period = "60s"

  # Also add a TCP check to verify the BEAM VM is listening on the internal port
  # This avoids false negatives when HTTP checks receive redirects (e.g., Plug.SSL).
  [[services.tcp_checks]]
    port = 8080
    interval = "10s"
    timeout = "5s"
    grace_period = "60s"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
